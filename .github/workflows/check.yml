name: Check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the Claude plugin and marketplace
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .

      - name: Check the Codex plugin and marketplace
        run: |
          status=0
          fail() { echo "::error::$1"; status=1; }

          plugin=.codex-plugin/plugin.json
          market=.agents/plugins/marketplace.json
          jq -e . "$plugin" > /dev/null || fail "$plugin is not valid JSON."
          jq -e . "$market" > /dev/null || fail "$market is not valid JSON."

          for field in .name .version .description .author.name .skills \
              .interface.displayName .interface.shortDescription \
              .interface.longDescription .interface.developerName \
              .interface.category .interface.composerIcon .interface.logo; do
            [ -n "$(jq -r "$field // empty" "$plugin")" ] || fail "$plugin has no $field."
          done
          jq -e '.interface.capabilities | type == "array"' "$plugin" > /dev/null \
            || fail "$plugin has no interface.capabilities array."

          [ "$(jq -r .name "$plugin")" = "$(jq -r .name .claude-plugin/plugin.json)" ] \
            || fail "The plugin name differs between .codex-plugin and .claude-plugin."
          [ "$(jq -r .name "$market")" = "$(jq -r .name .claude-plugin/marketplace.json)" ] \
            || fail "The marketplace name differs between .agents/plugins and .claude-plugin."
          [ "$(jq -r '.plugins | length' "$market")" = 1 ] \
            && [ "$(jq -r '.plugins[0].name' "$market")" = "$(jq -r .name "$plugin")" ] \
            || fail "$market must list exactly the plugin named in $plugin."
          for field in .source.source .source.path .policy.installation \
              .policy.authentication .category; do
            [ -n "$(jq -r ".plugins[0]$field // empty" "$market")" ] \
              || fail "The $market plugin entry has no $field."
          done

          # Manifest paths are relative to the plugin root, which is the
          # marketplace entry's source path.
          root=$(jq -r '.plugins[0].source.path' "$market")
          for path in $(jq -r '.skills, .interface.composerIcon, .interface.logo' "$plugin"); do
            case "$path" in ./*) ;; *) fail "$plugin path $path must start with ./" ;; esac
            [ -e "$root/$path" ] || fail "$plugin references a missing path: $path"
          done
          [ -f "$root/$(jq -r .skills "$plugin")/dotnetbrowser/SKILL.md" ] \
            || fail "The Codex skills folder has no dotnetbrowser/SKILL.md."

          exit $status

      - name: Check directory limits
        run: |
          status=0

          # The directory holds a plugin with more than 512 files for a
          # reviewer. Every tracked file counts, not only the skill.
          count=$(git ls-files | awk 'END { print NR }')
          if [ "$count" -gt 512 ]; then
            echo "::error::The plugin has $count files, more than 512."; status=1
          fi

          # Every file other than an image or a font must stay under 256 KiB.
          sizes=$(git ls-files -z \
            | grep -zviE '\.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf)$' \
            | xargs -0 stat -c '%s %n' \
            | sort -rn)
          large=$(echo "$sizes" | awk '$1 >= 262144')
          if [ -n "$large" ]; then
            echo "::error::Files of 256 KiB or more:"; echo "$large"; status=1
          fi

          # Logged so that growth is noticed before it fails a release. Images
          # and fonts are left out, because the 256 KiB limit doesn't apply to them.
          largest=$(echo "$sizes" | head -n 1)
          echo "The plugin has $count files; the limit is 512." \
            "The largest file under the 256 KiB limit is ${largest#* }," \
            "$(( ${largest%% *} / 1024 )) KiB."

          forbidden=$(git ls-files \
            | grep -E '(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini|__MACOSX)(/|$)' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Files the directory rejects:"; echo "$forbidden"; status=1
          fi

          links=$(git ls-files -s | awk '$1 == "120000" { print $4 }')
          if [ -n "$links" ]; then
            echo "::error::Symbolic links:"; echo "$links"; status=1
          fi

          if git ls-files -z | xargs -0 git check-attr filter export-ignore -- \
              | grep -vE ': (unspecified|unset)$'; then
            echo "::error::Remove filter or export-ignore attributes (including Git LFS)."
            status=1
          fi

          exit $status

      - name: Check version consistency
        run: |
          status=0
          fail() { echo "::error::$1"; status=1; }

          version=$(jq -r .version .claude-plugin/plugin.json)
          # A repository-only fix uses a suffix such as 4.3.3-1; the
          # DotNetBrowser version is the part before it.
          product=${version%%-*}
          echo "Plugin version: $version (DotNetBrowser $product)"

          if [ "$(jq -r '.plugins[0] | has("version")' .claude-plugin/marketplace.json)" = true ]; then
            fail "Remove 'version' from marketplace.json; plugin.json is the only source."
          fi
          jq -r .description .claude-plugin/plugin.json | grep -qF "DotNetBrowser $product," \
            || fail "plugin.json description does not name DotNetBrowser $product."
          jq -r '.plugins[0].description' .claude-plugin/marketplace.json | grep -qF "DotNetBrowser $product," \
            || fail "marketplace.json description does not name DotNetBrowser $product."
          [ "$(jq -r .version .codex-plugin/plugin.json)" = "$version" ] \
            || fail ".codex-plugin/plugin.json version is not $version."
          jq -r .description .codex-plugin/plugin.json | grep -qF "DotNetBrowser $product," \
            || fail ".codex-plugin/plugin.json description does not name DotNetBrowser $product."
          jq -r .interface.longDescription .codex-plugin/plugin.json | grep -qF "DotNetBrowser $product." \
            || fail ".codex-plugin/plugin.json longDescription does not name DotNetBrowser $product."
          grep -qF "DotNetBrowser $product**" README.md \
            || fail "README.md does not name DotNetBrowser $product."
          grep -qE "^  product-version: \"$product\"$" skills/dotnetbrowser/SKILL.md \
            || fail "SKILL.md product-version is not $product; replace the skill folder."

          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            fail "Tag $GITHUB_REF_NAME does not match plugin version $version."
          fi

          exit $status
